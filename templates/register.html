{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block page_heading %}Create account{% endblock %}
{% block content %}<div class="auth-wrap"><form class="panel auth-card" method="POST"><span class="section-kicker">JOIN THE COMMUNITY</span><h1>Create your account.</h1><p>Register to submit reports under your name.</p><label class="field"><span>Full name</span><input name="name" required placeholder="Your name"></label><label class="field"><span>Email address</span><input name="email" type="email" required placeholder="you@example.com"></label><label class="field"><span>Password</span><input name="password" type="password" minlength="8" required placeholder="At least 8 characters"></label><button class="btn btn-primary full-btn">Create account →</button><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></form></div>{% endblock %}
